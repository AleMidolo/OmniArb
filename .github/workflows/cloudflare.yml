name: Cloudflare Workers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMNIARB_MODE: PRE_LAUNCH
  NPM_VERSION: 11.19.1
  VINEXT_VERSION: 1.0.0-beta.9
  VINEXT_CLOUDFLARE_VERSION: 1.0.0-beta.7
  CLOUDFLARE_VITE_PLUGIN_VERSION: 1.31.0
  VITE_VERSION: 8.0.0
  VITE_RSC_VERSION: 0.5.34
  REACT_SERVER_DOM_WEBPACK_VERSION: 19.2.8
  WRANGLER_VERSION: 4.80.0

jobs:
  application-validate:
    name: Application lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  browser-validate:
    name: Application Playwright (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-gate-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  worker-validate:
    name: vinext check, build, Worker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Use pinned npm
        run: |
          npm install --global npm@${NPM_VERSION}
          npm config set allow-scripts=unrs-resolver,sharp,workerd,esbuild --location=user

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned Cloudflare migration toolchain
        run: >-
          npm install --no-save --package-lock=false
          vinext@${VINEXT_VERSION}
          @vinext/cloudflare@${VINEXT_CLOUDFLARE_VERSION}
          @cloudflare/vite-plugin@${CLOUDFLARE_VITE_PLUGIN_VERSION}
          vite@${VITE_VERSION}
          @vitejs/plugin-rsc@${VITE_RSC_VERSION}
          react-server-dom-webpack@${REACT_SERVER_DOM_WEBPACK_VERSION}
          wrangler@${WRANGLER_VERSION}

      - name: vinext compatibility check
        run: npx vinext check | tee vinext-check.txt

      - name: vinext production build
        run: npx vinext build

      - name: Record Worker bundle size
        run: |
          test -d dist/server
          du -sh dist/server | tee worker-size.txt
          find dist/server -type f -printf '%s %p\n' | sort -nr | head -20 >> worker-size.txt
          cat worker-size.txt

      - name: Local Worker runtime smoke tests
        run: bash scripts/cloudflare-smoke.sh

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-compatibility
          path: |
            vinext-check.txt
            worker-size.txt
          if-no-files-found: ignore
          retention-days: 14

  deploy-main:
    name: Deploy stable PRE_LAUNCH Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - application-validate
      - browser-validate
      - worker-validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pre-launch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Use pinned npm
        run: |
          npm install --global npm@${NPM_VERSION}
          npm config set allow-scripts=unrs-resolver,sharp,workerd,esbuild --location=user

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned Cloudflare migration toolchain
        run: >-
          npm install --no-save --package-lock=false
          vinext@${VINEXT_VERSION}
          @vinext/cloudflare@${VINEXT_CLOUDFLARE_VERSION}
          @cloudflare/vite-plugin@${CLOUDFLARE_VITE_PLUGIN_VERSION}
          vite@${VITE_VERSION}
          @vitejs/plugin-rsc@${VITE_RSC_VERSION}
          react-server-dom-webpack@${REACT_SERVER_DOM_WEBPACK_VERSION}
          wrangler@${WRANGLER_VERSION}

      - name: Build Worker
        run: npx vinext build

      - name: Deploy stable Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config dist/server/wrangler.json

  deploy-pr-preview:
    name: Upload PR preview Worker
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - application-validate
      - browser-validate
      - worker-validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pre-launch
    steps:
      - name: Check Cloudflare bootstrap
        id: cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "${CLOUDFLARE_ACCOUNT_ID}" && -n "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cloudflare preview upload skipped until DEP-001 bootstrap credentials from issue #11 are configured."
          fi

      - name: Checkout
        if: steps.cloudflare.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.cloudflare.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Use pinned npm
        if: steps.cloudflare.outputs.available == 'true'
        run: |
          npm install --global npm@${NPM_VERSION}
          npm config set allow-scripts=unrs-resolver,sharp,workerd,esbuild --location=user

      - name: Install application dependencies
        if: steps.cloudflare.outputs.available == 'true'
        run: npm ci

      - name: Install pinned Cloudflare migration toolchain
        if: steps.cloudflare.outputs.available == 'true'
        run: >-
          npm install --no-save --package-lock=false
          vinext@${VINEXT_VERSION}
          @vinext/cloudflare@${VINEXT_CLOUDFLARE_VERSION}
          @cloudflare/vite-plugin@${CLOUDFLARE_VITE_PLUGIN_VERSION}
          vite@${VITE_VERSION}
          @vitejs/plugin-rsc@${VITE_RSC_VERSION}
          react-server-dom-webpack@${REACT_SERVER_DOM_WEBPACK_VERSION}
          wrangler@${WRANGLER_VERSION}

      - name: Build Worker
        if: steps.cloudflare.outputs.available == 'true'
        run: npx vinext build

      - name: Apply Worker preview routing
        if: steps.cloudflare.outputs.available == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler triggers deploy --config dist/server/wrangler.json

      - name: Upload version with stable PR alias
        if: steps.cloudflare.outputs.available == 'true'
        id: preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          npx wrangler versions upload \
            --config dist/server/wrangler.json \
            --preview-alias pr-${{ github.event.pull_request.number }} | tee wrangler-preview.txt
          PREVIEW_URL="$(sed -n 's/^Version Preview Alias URL: //p' wrangler-preview.txt | tail -1)"
          test -n "${PREVIEW_URL}"
          echo "url=${PREVIEW_URL}" >> "${GITHUB_OUTPUT}"

      - name: Hosted PRE_LAUNCH Worker smoke tests
        if: steps.cloudflare.outputs.available == 'true'
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
        run: bash scripts/cloudflare-smoke.sh
